name: ✨ 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: 需求描述
      description: 你希望它解决什么问题？
    validations: { required: true }
  - type: textarea
    id: how
    attributes:
      label: 你设想的实现方式（可选）
    validations: { required: false }
