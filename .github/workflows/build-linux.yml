# 远程构建 Linux .deb（Ubuntu 26.04；不产出 tar.gz / artifact zip）
name: Build Linux (hov-qt)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

permissions:
  contents: write   # 上传 Release 资产（直接 .deb，无 zip 套娃）

jobs:
  package:
    name: Ubuntu .deb
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev libmpv-dev \
            qt6-qpa-plugins \
            dpkg-dev

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure & build (Release, no WebEngine)
        run: |
          cmake -S desktop -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DHOV_WEBENGINE=OFF
          cmake --build build -j"$(nproc)"

      - name: Local path-list unit test
        run: |
          python3 scripts/test_mpv_pathlist.py
          QT_QPA_PLATFORM=offscreen ./build/hov-qt --queue-selftest --exit-after 12

      - name: Package .deb
        run: |
          set -euo pipefail
          ROOT="$PWD/deb-root"
          rm -rf "$ROOT"
          cmake --install build --prefix "$ROOT/usr"
          mkdir -p "$ROOT/DEBIAN"
          printf '%s\n' \
            'Package: hov-qt' \
            'Version: 1.2.7-1' \
            'Section: video' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: HyperVideo fork <noreply@users.noreply.github.com>' \
            'Depends: libmpv2, yt-dlp, ffmpeg, libqt6widgets6, libqt6openglwidgets6, libqt6network6, libqt6dbus6' \
            'Recommends: qt6-wayland' \
            'Description: Hyper Online Video Qt6 client (fork)' \
            ' YouTube/Bilibili/NetEase/QQ Music aggregator with libmpv.' \
            ' 1.2.7: escape mpv audio-files colons so DASH audio plays; co-developed with Cursor.' \
            > "$ROOT/DEBIAN/control"
          dpkg-deb --build "$ROOT" hov-qt_1.2.7-1_amd64.deb
          dpkg-deb -I hov-qt_1.2.7-1_amd64.deb
          ls -lh hov-qt_1.2.7-1_amd64.deb

      - name: Publish .deb on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.7
          name: hov-qt v1.2.7 (Ubuntu 26.04)
          body: |
            Fix silent YouTube DASH audio (mpv audio-files split on ':')
            - Escape localhost proxy URLs before setting audio-files
            - QTcpServer close on IO thread (no missing-slot warning)
            - Co-developed with Cursor (https://cursor.com)
          files: hov-qt_1.2.7-1_amd64.deb
          make_latest: true
          fail_on_unmatched_files: true
