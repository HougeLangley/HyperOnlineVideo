# 远程构建 Linux 桌面包（不占用本机轻薄本算力）
# 触发：push main / 手动 workflow_dispatch
# 产物：hov-qt .deb + 便携 tar.gz
name: Build Linux (hov-qt)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Ubuntu .deb + tar.gz
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev libmpv-dev

      - name: Configure & build (Release, no WebEngine)
        run: |
          cmake -S desktop -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DHOV_WEBENGINE=OFF
          cmake --build build -j"$(nproc)"

      - name: Package tar.gz
        run: |
          DEST="$PWD/stage"
          cmake --install build --prefix "$DEST/usr"
          cat > "$DEST/README-RUNTIME.txt" <<'EOF'
          hov-qt 1.2.6 — Issue #1 googlevideo chunked Range proxy

          Co-developed with Cursor (https://cursor.com).
          Upstream: https://github.com/HougeLangley/HyperOnlineVideo

          Runtime deps (Ubuntu/Debian):
            sudo apt-get install -y libmpv2 yt-dlp ffmpeg \
              libqt6widgets6 libqt6openglwidgets6 libqt6network6 libqt6dbus6

          Run:
            ./usr/bin/hov-qt
          EOF
          tar -C stage -czf hov-qt-1.2.6-linux-x86_64.tar.gz .
          ls -lh hov-qt-1.2.6-linux-x86_64.tar.gz

      - name: Package .deb
        run: |
          set -euo pipefail
          ROOT="$PWD/deb-root"
          rm -rf "$ROOT"
          cmake --install build --prefix "$ROOT/usr"
          mkdir -p "$ROOT/DEBIAN"
          printf '%s\n' \
            'Package: hov-qt' \
            'Version: 1.2.6-1' \
            'Section: video' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: HyperVideo fork <noreply@users.noreply.github.com>' \
            'Depends: libmpv2, yt-dlp, ffmpeg, libqt6widgets6, libqt6openglwidgets6, libqt6network6, libqt6dbus6' \
            'Recommends: qt6-wayland' \
            'Description: Hyper Online Video Qt6 client (fork)' \
            ' YouTube/Bilibili/NetEase/QQ Music aggregator with libmpv.' \
            ' 1.2.6: googlevideo chunked Range proxy (Issue #1); co-developed with Cursor.' \
            > "$ROOT/DEBIAN/control"
          dpkg-deb --build "$ROOT" hov-qt_1.2.6-1_amd64.deb
          dpkg-deb -I hov-qt_1.2.6-1_amd64.deb
          ls -lh hov-qt_1.2.6-1_amd64.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hov-qt-1.2.6-linux
          path: |
            hov-qt_1.2.6-1_amd64.deb
            hov-qt-1.2.6-linux-x86_64.tar.gz
          if-no-files-found: error
