# ── 聚合视频 CI（自研 ✓ 2026-10-08；替代整合前 fork 的 build-linux.yml ✗）──
# 设计原则：
#   ① 托管 runner 跑"快门禁 + 三端构建"（公开仓库 Actions 免费 · 含 macOS ✓）
#   ② 内网打包机以 **self-hosted runner** 接入（**出站连接** ✓ 无需公网入口 ✓）跑重活
#   ③ 一切"发布类动作"（渠道推送 / Release 转正）均在 environment 人工批准闸门下 ✓（规则 #8 ✓）
name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 22 * * *'   # 每日 06:17 北京时间夜巡 ✓
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ① 门禁：Linux 桌面（clang · 0 告警为硬性 ✓）+ 逻辑自测 + 三脚本审核
  gate-linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container: ubuntu:26.04          # 24.04 缺 QOverload/Qt6.5 API ✗（历史踩坑 ✓）
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: 依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential clang lld cmake ninja-build \
            pkg-config qt6-base-dev qt6-declarative-dev libmpv-dev mpv qt6-qpa-plugins python3 yt-dlp
      - name: 构建（-Wextra 加严 · 告警即失败 ✓）
        run: |
          cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHOV_WEBENGINE=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-Wextra"
          cmake --build build -j"$(nproc)" 2>&1 | tee /tmp/build.log
          test "$(grep -c 'warning:' /tmp/build.log)" = "0"
      - name: 逻辑自测（干净退出 ✓）
        run: QT_QPA_PLATFORM=offscreen ./build/hov-qt --queue-selftest --exit-after 12
      - name: 审核脚本（死码/版本一致 ✓）
        run: |
          python3 scripts/audit-code.py
          python3 scripts/check-versions.py
          # 注：scripts/test_mpv_pathlist.py 含"真实媒体播放"集成断言 ✗（容器内无媒体/网络必挂 ✗，
          #     fork 原 CI 亦未纳入 ✓）→ 保留为本地/手工检查 ✓（2026-10-08）

  # ② macOS：Swift 构建 + 119 项逻辑自检
  gate-macos:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: 依赖（libmpv ✓）
        run: brew install mpv || true
      - name: 构建
        run: cd macos && swift build -c release
      - name: 逻辑自检（119/119 ✓）
        run: |
          BIN="$(cd macos && swift build -c release --show-bin-path)/HyperOnlineVideo"
          "$BIN" --queue-selftest > /tmp/mac-self.log 2>&1 &
          PID=$!; sleep 45; kill $PID 2>/dev/null || true
          grep -q "119 / 119" /tmp/mac-self.log && echo "✓ 自检 119/119" || (tail -20 /tmp/mac-self.log; exit 1)

  # ③ Android：Debug 构建 + 单测（PR 门禁 ✓；签名发布走 secrets/environment ✓ 见发布案 70 §31）
  gate-android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建 + 单测
        run: |
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
      - name: Kotlin 告警即失败 ✓
        run: |
          ./gradlew :app:compileReleaseKotlin --rerun-tasks --console=plain 2>&1 | tee /tmp/kt.log
          test "$(grep -c '^w:' /tmp/kt.log)" = "0"
      - name: Android Lint（信息级 ✓ 不阻塞；阈值收紧作为后续 ✓）
        continue-on-error: true
        run: ./gradlew :app:lintRelease --console=plain 2>&1 | tail -20

  # ④ 内网打包机（self-hosted · 出站连接 ✓）：tag 发布时才跑；含隔离容器；人工批准闸门 ✓
  packages-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate-linux]
    runs-on: [self-hosted, linux, x64, hov-ubuntu]      # 10.6.146.152 上的 runner ✓
    environment: release-approval                        # ← 人工批准后才执行 ✓（规则 #8 ✓）
    timeout-minutes: 120
    permissions:
      contents: write      # Release 资产上传 ✓
      packages: write      # GHCR（GitHub Packages）✓
    steps:
      - uses: actions/checkout@v5
      - name: deb（隔离容器 · 用后即毁 ✓）
        run: bash desktop/packaging/ci/build-deb-container.sh
      - name: rpm（COPR 服务端构建 ✓ 取回成品 ✓）
        env: { HOVBUILD: '${{ secrets.HOVBUILD }}' }
        run: bash desktop/packaging/ci/fetch-rpm-from-copr.sh
      - name: AppImage（容器 ✓）
        run: bash desktop/packaging/ci/build-appimage-container.sh
      - name: 发布到 GitHub Packages（GHCR · OCI 制品 ✓）
        # GitHub Packages 没有「通用文件」仓库 ✗ → 官方等效 = GHCR OCI 制品 ✓
        # 用户侧：oras pull ghcr.io/hougelangley/hov-qt:<版本> ✓（公开包 ✓ 无需登录 ✓）
        run: |
          curl -fsSL -o /tmp/oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.3/oras_1.2.3_linux_amd64.tar.gz
          tar xzf /tmp/oras.tgz -C /tmp oras && export PATH="/tmp:$PATH"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          VER="${GITHUB_REF_NAME#v}"
          cd out
          FILES=(); for f in *; do case "$f" in
            *.deb) FILES+=("$f:application/vnd.debian.binary-package");;
            *.rpm) FILES+=("$f:application/vnd.rpm");;
            *.AppImage) FILES+=("$f:application/vnd.appimage");;
            *) FILES+=("$f");; esac; done
          oras push "ghcr.io/hougelangley/hov-qt:${VER}" --artifact-type application/vnd.hov.release "${FILES[@]}"
      - name: 上传到 Release（草稿自动创建 ✓ 转正由人决定 ✓）
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "聚合视频 $TAG" \
              --notes-file "docs/RELEASE_NOTES-${TAG}.md" || \
            gh release create "$TAG" --draft --title "聚合视频 $TAG" --notes "自动草稿（详见 docs/）"
          for f in out/*; do gh release upload "$TAG" "$f" --clobber; done
      - name: 渠道排队（COPR · AUR · OBS —— 都属发布动作 → 同受 environment 闸门 ✓）
        # 凭据统一来自仓库单条 Secret **HOVBUILD**（KEY=VALUE 多行 env 包 ✓ 脚本按需取用；
        # 只打印"存在哪些键"✗ 绝不打印值 ✓）
        env:
          HOVBUILD: '${{ secrets.HOVBUILD }}'
        run: bash desktop/packaging/ci/dispatch-channels.sh

  # ⑤ 夜巡：国内服务探针 + yt-dlp 版本监测 → 失败自动开 issue ✓
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 探针（B站 wbi / 网易云 / QQ / yt-dlp 版本 ✓）
        run: bash desktop/packaging/ci/nightly-probes.sh > /tmp/probe.log 2>&1 || true
      - name: 失败则开 issue ✓
        if: failure()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh issue create --title "夜巡失败 $(date +%F)" --body "$(tail -40 /tmp/probe.log)"

# ── 依赖脚本清单（desktop/packaging/ci/，随下次推送一并就绪 ✓）──
#   build-deb-container.sh      隔离容器构建 deb（用后即毁 ✓）
#   build-rpm-mock.sh           mock 隔离构建 rpm ✓
#   fetch-rpm-from-copr.sh      从 COPR 取回 rpm 成品 ✓（Fedora 由服务端构建 ✓）
#   build-appimage-container.sh 容器内构建 AppImage ✓
#   dispatch-channels.sh        解析 $HOVBUILD 的 KEY=VALUE → copr-cli / AUR / OBS ✓
#   （GHCR 发布内联于 packages-linux ✓ 见上）
#   nightly-probes.sh           B站 wbi / 网易云 / QQ / yt-dlp 版本探针 ✓
